<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Plan your work and track your progress with Task Manager.">
  <meta name="theme-color" content="#064e3b">
  <title>Task Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip-link" href="#task-title">Skip to add task</a>

  <div class="app">
    <header class="hero">
      <p class="eyebrow">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" focusable="false"><path d="M20 6 9 17l-5-5"/></svg>
        </span>
        Stay organized
      </p>
      <h1>Task Manager</h1>
      <p class="subtitle">Plan your work. Track your progress. Get more done.</p>
      <p class="date-pill" id="today-date"></p>
    </header>

    <section class="stats" aria-label="Task summary">
      <div class="stat-card stat-total">
        <span class="stat-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" focusable="false"><path d="M8 6h13M8 12h13M8 18h13"/><path d="M3 6h.01M3 12h.01M3 18h.01"/></svg>
        </span>
        <div class="stat-text">
          <span class="stat-label">Total tasks</span>
          <strong class="stat-value" id="total-count">0</strong>
        </div>
      </div>

      <div class="stat-card stat-done">
        <span class="stat-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" focusable="false"><circle cx="12" cy="12" r="10"/><path d="m8 12 3 3 5-6"/></svg>
        </span>
        <div class="stat-text">
          <span class="stat-label">Completed</span>
          <strong class="stat-value" id="completed-count">0</strong>
        </div>
      </div>

      <div class="stat-card stat-pending">
        <span class="stat-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" focusable="false"><circle cx="12" cy="12" r="10"/><path d="M12 7v5l3 2"/></svg>
        </span>
        <div class="stat-text">
          <span class="stat-label">Pending</span>
          <strong class="stat-value" id="pending-count">0</strong>
        </div>
      </div>
    </section>

    <main>
      <section class="card" aria-labelledby="add-heading">
        <h2 class="card-title" id="add-heading">Add a new task</h2>
        <p class="card-hint">Capture what needs to be done and keep moving.</p>

        <form id="task-form" class="task-form">
          <label class="sr-only" for="task-title">Task title</label>
          <input id="task-title" class="text-input" type="text" placeholder="What needs to be done?" autocomplete="off" required>
          <button id="add-btn" class="btn btn-primary" type="submit">
            <span class="icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" focusable="false"><path d="M12 5v14M5 12h14"/></svg>
            </span>
            Add Task
          </button>
        </form>
      </section>

      <section class="card tasks-section" aria-labelledby="tasks-heading">
        <div class="list-head">
          <h2 class="card-title" id="tasks-heading">Your tasks</h2>
          <button id="refresh-btn" class="btn btn-secondary btn-sm" type="button">
            <span class="icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" focusable="false"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
            </span>
            Refresh
          </button>
        </div>

        <div class="progress">
          <div class="progress-meta">
            <span>Overall progress</span>
            <span id="progress-label">No tasks yet</span>
          </div>
          <div class="progress-track" id="progress-track" role="progressbar" aria-label="Task completion" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div class="progress-fill" id="progress-fill"></div>
          </div>
        </div>

        <p id="message" class="message" role="status" aria-live="polite"></p>
        <ul id="task-list" class="task-list" aria-busy="false"></ul>
      </section>
    </main>

    <footer class="footer">Powered by Express REST API and MongoDB Atlas</footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
